name: Validate distribution

on:
  pull_request:
    branches:
      - source
  push:
    branches:
      - source

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Run release checks
        run: scripts/release-check
